name: Folio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: folio-${{ github.workflow }}-${{ github.ref }}
  # Keep queued platform builds alive while the branch receives follow-up fixes.
  cancel-in-progress: false
jobs:
  macos-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Swift build
        run: cd macOS && swift build
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android assemble
        run: gradle -p Android :app:assembleDebug
