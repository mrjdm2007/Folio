name: Folio CI
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel platform builds when follow-up commits arrive.
  cancel-in-progress: false
jobs:
  macos-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build macOS executable
        run: cd macOS && swift build --configuration debug
      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Folio-macOS-executable
          path: macOS/.build/debug/Folio
          if-no-files-found: error
          retention-days: 14
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android assemble
        run: gradle -p Android :app:assembleDebug
      - name: Verify APK output
        run: test -s Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
