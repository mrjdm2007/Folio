name: Folio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel platform builds when follow-up commits arrive.
  cancel-in-progress: false
jobs:
  macos-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build macOS executable
        run: cd macOS && swift build --configuration debug
      - name: Package macOS app with Folio icon
        run: |
          mkdir -p macOS/Folio.iconset macOS/Folio.app/Contents/MacOS macOS/Folio.app/Contents/Resources
          swift macOS/scripts/generate-icon.swift "$RUNNER_TEMP/folio-icon.png"
          sips -z 16 16 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 "$RUNNER_TEMP/folio-icon.png" --out macOS/Folio.iconset/icon_512x512.png >/dev/null
          cp "$RUNNER_TEMP/folio-icon.png" macOS/Folio.iconset/icon_512x512@2x.png
          iconutil -c icns macOS/Folio.iconset -o macOS/Folio.app/Contents/Resources/AppIcon.icns
          cp macOS/.build/debug/Folio macOS/Folio.app/Contents/MacOS/Folio
          cat > macOS/Folio.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Folio</string>
            <key>CFBundleIdentifier</key><string>app.folio.notes</string>
            <key>CFBundleName</key><string>Folio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleIconFile</key><string>AppIcon</string>
          </dict></plist>
          PLIST
          plutil -lint macOS/Folio.app/Contents/Info.plist
          ditto -c -k --sequesterRsrc --keepParent macOS/Folio.app macOS/Folio-macOS.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Folio-macOS-app
          path: macOS/Folio-macOS.zip
          if-no-files-found: error
          retention-days: 14
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android assemble
        run: gradle -p Android :app:assembleDebug
      - name: Verify APK output
        run: test -s Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
